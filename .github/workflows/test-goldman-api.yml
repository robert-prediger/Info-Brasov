name: Find Goldman Fund API

on:
  workflow_dispatch:

jobs:
  find-goldman-api:
    runs-on: ubuntu-latest

    steps:
      - name: Find Goldman API endpoints
        run: |
          python <<'PY'
          import re
          import urllib.request
          import urllib.parse
          import html as htmlmod

          PAGE = (
              "https://am.gs.com/ro-ro/individual/funds"
              "?locale=ro-ro"
              "&audience=individual"
              "&sf=currencies"
              "&filters=currencies%7CRON"
          )

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "ro-RO,ro;q=0.9,en;q=0.8",
          }


          def download(url):
              req = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  return (
                      response.status,
                      response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )
                  )


          print("=" * 70)
          print("GOLDMAN FUND API FINDER")
          print("=" * 70)

          status, page = download(PAGE)

          print("PAGE HTTP:", status)
          print("PAGE SIZE:", len(page))


          # ------------------------------------------------
          # Find JavaScript files
          # ------------------------------------------------

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              page,
              flags=re.I
          )

          scripts = list(
              dict.fromkeys(
                  htmlmod.unescape(x)
                  for x in scripts
              )
          )

          print("JS FILES FOUND:", len(scripts))
          print()


          # ------------------------------------------------
          # Download JS and search for useful references
          # ------------------------------------------------

          keywords = [
              "fundfinder",
              "fundFinder",
              "fund-search",
              "fundSearch",
              "shareclass",
              "shareClass",
              "share-class",
              "isin",
              "graphql",
              "/api/",
              "api.",
              "nav",
              "productSearch",
              "product-search",
          ]

          all_hits = []


          for number, script in enumerate(
              scripts,
              start=1
          ):

              url = urllib.parse.urljoin(
                  PAGE,
                  script
              )

              try:
                  js_status, js = download(url)

              except Exception as e:
                  print(
                      f"JS {number:02d} ERROR:",
                      type(e).__name__
                  )
                  continue


              lower = js.lower()

              matched = [
                  keyword
                  for keyword in keywords
                  if keyword.lower() in lower
              ]

              if not matched:
                  continue


              print()
              print("-" * 70)
              print(
                  f"JS {number:02d}:",
                  url
              )
              print(
                  "HTTP:",
                  js_status
              )
              print(
                  "SIZE:",
                  len(js)
              )
              print(
                  "KEYWORDS:",
                  ", ".join(matched)
              )


              # --------------------------------------------
              # Extract URLs
              # --------------------------------------------

              urls = re.findall(
                  r'https?://[^"\'\\\s<>]+',
                  js
              )

              for value in urls:

                  value = (
                      value
                      .replace("\\u002F", "/")
                      .replace("\\/", "/")
                  )

                  low = value.lower()

                  if any(
                      word in low
                      for word in [
                          "api",
                          "fund",
                          "product",
                          "graphql",
                          "share",
                      ]
                  ):

                      hit = "URL: " + value

                      if hit not in all_hits:
                          all_hits.append(hit)


              # --------------------------------------------
              # Extract quoted paths / strings
              # --------------------------------------------

              strings = re.findall(
                  r'["\']([^"\']{4,350})["\']',
                  js
              )

              for value in strings:

                  low = value.lower()

                  if any(
                      word in low
                      for word in [
                          "fundfinder",
                          "fund-search",
                          "fundsearch",
                          "shareclass",
                          "share-class",
                          "graphql",
                          "/api/",
                          "productsearch",
                          "product-search",
                      ]
                  ):

                      hit = "STRING: " + value

                      if hit not in all_hits:
                          all_hits.append(hit)


              # --------------------------------------------
              # Show context around ISIN references
              # --------------------------------------------

              for term in [
                  "isin",
                  "fundFinder",
                  "fundfinder",
                  "shareClass",
                  "shareclass",
                  "graphql",
              ]:

                  position = lower.find(
                      term.lower()
                  )

                  if position >= 0:

                      start = max(
                          0,
                          position - 250
                      )

                      end = min(
                          len(js),
                          position + 500
                      )

                      context = js[start:end]

                      context = re.sub(
                          r"\s+",
                          " ",
                          context
                      )

                      print()
                      print(
                          f"CONTEXT [{term}]:"
                      )
                      print(
                          context[:750]
                      )


          # ------------------------------------------------
          # Final candidate list
          # ------------------------------------------------

          print()
          print()
          print("=" * 70)
          print("FINAL API / ENDPOINT CANDIDATES")
          print("=" * 70)

          if not all_hits:
              print("NONE")

          else:
              for i, hit in enumerate(
                  all_hits[:150],
                  start=1
              ):
                  print(
                      f"{i:03d}: {hit}"
                  )


          print()
          print("=" * 70)
          print("SEARCH FINISHED")
          print("=" * 70)

          PY

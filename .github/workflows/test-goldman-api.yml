name: Test Goldman Funds GraphQL

on:
  workflow_dispatch:

jobs:
  test-funds-api:
    runs-on: ubuntu-latest

    steps:
      - name: Test Goldman funds service
        run: |
          python <<'PY'
          import json
          import urllib.request
          import urllib.error

          BASE = "https://am.gs.com"
          ENDPOINT = BASE + "/services/funds"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept": "application/json",
              "Content-Type": "application/json",
              "Origin": BASE,
              "Referer": (
                  BASE +
                  "/ro-ro/individual/funds"
                  "?locale=ro-ro&audience=individual"
              ),
              "Accept-Language":
                  "ro-RO,ro;q=0.9,en;q=0.8"
          }

          ISINS = [
              "LU0345402092",
              "LU1505916434"
          ]

          print("=" * 70)
          print("GOLDMAN SACHS FUND SERVICE TEST")
          print("=" * 70)
          print("ENDPOINT:", ENDPOINT)
          print()


          def request(method, data=None):

              body = None

              if data is not None:
                  body = json.dumps(data).encode("utf-8")

              req = urllib.request.Request(
                  ENDPOINT,
                  data=body,
                  headers=HEADERS,
                  method=method
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      raw = response.read()

                      print(
                          "HTTP:",
                          response.status
                      )

                      print(
                          "CONTENT TYPE:",
                          response.headers.get(
                              "Content-Type"
                          )
                      )

                      print(
                          "SIZE:",
                          len(raw)
                      )

                      text = raw.decode(
                          "utf-8",
                          errors="ignore"
                      )

                      return (
                          response.status,
                          text
                      )

              except urllib.error.HTTPError as e:

                  raw = e.read()

                  text = raw.decode(
                      "utf-8",
                      errors="ignore"
                  )

                  print(
                      "HTTP ERROR:",
                      e.code
                  )

                  print(
                      "CONTENT TYPE:",
                      e.headers.get(
                          "Content-Type"
                      )
                  )

                  print(
                      "SIZE:",
                      len(raw)
                  )

                  print(
                      "RESPONSE:",
                      text[:3000]
                  )

                  return (
                      e.code,
                      text
                  )


          # ================================================
          # TEST 1
          # GET request
          # ================================================

          print()
          print("=" * 70)
          print("TEST 1 - GET")
          print("=" * 70)

          try:
              status, text = request("GET")

              print(
                  "BODY:",
                  text[:3000]
              )

          except Exception as e:
              print(
                  "GET ERROR:",
                  type(e).__name__,
                  str(e)
              )


          # ================================================
          # TEST 2
          # Standard GraphQL typename query
          # ================================================

          print()
          print("=" * 70)
          print("TEST 2 - GRAPHQL TYPENAME")
          print("=" * 70)

          payload = {
              "query": """
                  query {
                      __typename
                  }
              """
          }

          try:
              status, text = request(
                  "POST",
                  payload
              )

              print(
                  "BODY:",
                  text[:3000]
              )

          except Exception as e:
              print(
                  "GRAPHQL ERROR:",
                  type(e).__name__,
                  str(e)
              )


          # ================================================
          # TEST 3
          # GraphQL schema query
          # ================================================

          print()
          print("=" * 70)
          print("TEST 3 - GRAPHQL SCHEMA")
          print("=" * 70)

          payload = {
              "query": """
                  query {
                      __schema {
                          queryType {
                              name
                          }
                      }
                  }
              """
          }

          try:
              status, text = request(
                  "POST",
                  payload
              )

              print(
                  "BODY:",
                  text[:5000]
              )

          except Exception as e:
              print(
                  "SCHEMA ERROR:",
                  type(e).__name__,
                  str(e)
              )


          # ================================================
          # TEST 4
          # Search response for our ISINs
          # ================================================

          print()
          print("=" * 70)
          print("ISIN CHECK")
          print("=" * 70)

          for isin in ISINS:
              print(
                  isin,
                  "FOUND"
                  if isin in text
                  else "NOT FOUND"
              )


          print()
          print("=" * 70)
          print("TEST FINISHED")
          print("=" * 70)

          PY

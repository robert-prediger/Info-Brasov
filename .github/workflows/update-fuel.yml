name: Update OMV fuel prices

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GazOnline and update fuel.json
        shell: python
        run: |
          import urllib.request
          import re
          import json
          from datetime import datetime

          url = "https://www.gazonline.ro/cautare.php?jud_cod=BV&loc_id=2000&wsr=6b07df789c50cf06c7350ec1cdac0a0e"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          html = urllib.request.urlopen(req, timeout=30).read()
          text = html.decode("iso-8859-2", errors="ignore")

          text = re.sub(r"<script.*?</script>", " ", text,
                        flags=re.I | re.S)
          text = re.sub(r"<style.*?</style>", " ", text,
                        flags=re.I | re.S)
          text = re.sub(r"<[^>]+>", " ", text)
          text = text.replace("&nbsp;", " ")
          text = re.sub(r"\s+", " ", text)

          marker = "13 Decembrie"
          pos = text.find(marker)

          if pos == -1:
              raise RuntimeError("OMV 13 Decembrie nu a fost gasit.")

          section = text[max(0, pos-500):pos+1000]

          m = re.search(
              r"(\d{2}/\d{2}/\d{2})\s+(\d{2}:\d{2})"
              r".*?(\d+\.\d+)\s+-\s+"
              r"(\d+\.\d+)\s+"
              r"(\d+\.\d+)\s+"
              r"(\d+\.\d+)",
              section
          )

          if not m:
              raise RuntimeError("Preturile nu au putut fi extrase.")

          date, hour, maxx100, maxx95, maxxdiesel, diesel = m.groups()

          prices = list(map(float, [
              maxx100, maxx95, maxxdiesel, diesel
          ]))

          if not all(5 < p < 20 for p in prices):
              raise RuntimeError("Preturi suspecte. fuel.json nu este modificat.")

          updated = datetime.strptime(
              date + " " + hour, "%d/%m/%y %H:%M"
          ).strftime("%d.%m.%Y %H:%M")

          data = {
              "source": "GazOnline",
              "station": "OMV Brasov 3, Bd. 13 Decembrie 1-3",
              "updated": updated,
              "prices": {
                  "super95": float(maxx95),
                  "maxx100": float(maxx100),
                  "diesel": float(diesel),
                  "maxxdiesel": float(maxxdiesel)
              }
          }

          with open("fuel.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(data)

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel.json

          if git diff --cached --quiet; then
            echo "No fuel price changes."
          else
            git commit -m "Update OMV fuel prices"
            git push
          fi

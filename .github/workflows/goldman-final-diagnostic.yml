name: Goldman Final Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Discover Goldman fund GraphQL schema
        run: |
          python <<'PY'
          import json
          import urllib.request
          import urllib.error

          ENDPOINT = "https://am.gs.com/services/funds"

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
              "Content-Type": "application/json",
              "Origin": "https://am.gs.com",
              "Referer": "https://am.gs.com/ro-ro/individual/funds",
              "Accept-Language": "ro-RO,ro;q=0.9,en;q=0.8"
          }

          QUERY = r"""
          query FinalDiagnostic {
            __schema {
              queryType {
                name
                fields {
                  name
                  description
                  args {
                    name
                    description
                    defaultValue
                    type {
                      kind
                      name
                      ofType {
                        kind
                        name
                        ofType {
                          kind
                          name
                          ofType {
                            kind
                            name
                          }
                        }
                      }
                    }
                  }
                  type {
                    kind
                    name
                    ofType {
                      kind
                      name
                      ofType {
                        kind
                        name
                        ofType {
                          kind
                          name
                        }
                      }
                    }
                  }
                }
              }

              types {
                kind
                name
                description

                fields {
                  name
                  description

                  args {
                    name
                    description
                    defaultValue

                    type {
                      kind
                      name
                      ofType {
                        kind
                        name
                        ofType {
                          kind
                          name
                        }
                      }
                    }
                  }

                  type {
                    kind
                    name
                    ofType {
                      kind
                      name
                      ofType {
                        kind
                        name
                        ofType {
                          kind
                          name
                        }
                      }
                    }
                  }
                }

                inputFields {
                  name
                  description
                  defaultValue

                  type {
                    kind
                    name
                    ofType {
                      kind
                      name
                      ofType {
                        kind
                        name
                      }
                    }
                  }
                }

                enumValues {
                  name
                  description
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": QUERY
          }).encode("utf-8")

          req = urllib.request.Request(
              ENDPOINT,
              data=payload,
              headers=HEADERS,
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:

                  raw = response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

                  print("HTTP:", response.status)

          except urllib.error.HTTPError as e:

              raw = e.read().decode(
                  "utf-8",
                  errors="ignore"
              )

              print("HTTP:", e.code)
              print(raw)
              raise

          result = json.loads(raw)

          if result.get("errors"):
              print("GRAPHQL ERRORS:")
              print(
                  json.dumps(
                      result["errors"],
                      indent=2,
                      ensure_ascii=False
                  )
              )

          schema = result.get(
              "data",
              {}
          ).get(
              "__schema"
          )

          if not schema:
              raise RuntimeError(
                  "No GraphQL schema returned"
              )

          print()
          print("=" * 80)
          print("QUERY FIELDS")
          print("=" * 80)

          query_fields = (
              schema
              .get("queryType", {})
              .get("fields", [])
          )

          for field in query_fields:
              print()
              print("QUERY:", field["name"])
              print(
                  "DESCRIPTION:",
                  field.get("description")
              )

              print("ARGUMENTS:")

              for arg in field.get(
                  "args",
                  []
              ):
                  print(
                      "  -",
                      arg["name"],
                      json.dumps(
                          arg["type"],
                          separators=(",", ":")
                      )
                  )

              print(
                  "RETURNS:",
                  json.dumps(
                      field.get("type"),
                      separators=(",", ":")
                  )
              )


          print()
          print("=" * 80)
          print("FUND-RELATED TYPES")
          print("=" * 80)

          keywords = (
              "fund",
              "share",
              "nav",
              "price",
              "isin",
              "performance",
              "search",
              "product"
          )

          interesting = []

          for t in schema.get(
              "types",
              []
          ):

              name = (
                  t.get("name")
                  or ""
              )

              fields = t.get(
                  "fields"
              ) or []

              inputs = t.get(
                  "inputFields"
              ) or []

              combined = " ".join(
                  [
                      name
                  ]
                  +
                  [
                      f.get("name", "")
                      for f in fields
                  ]
                  +
                  [
                      f.get("name", "")
                      for f in inputs
                  ]
              ).lower()

              if any(
                  keyword in combined
                  for keyword in keywords
              ):
                  interesting.append(t)


          for t in interesting:

              print()
              print("-" * 80)
              print(
                  "TYPE:",
                  t.get("kind"),
                  t.get("name")
              )

              if t.get("description"):
                  print(
                      "DESCRIPTION:",
                      t["description"]
                  )

              fields = t.get(
                  "fields"
              ) or []

              if fields:
                  print("FIELDS:")

                  for field in fields:
                      print(
                          "  *",
                          field["name"],
                          "=>",
                          json.dumps(
                              field.get("type"),
                              separators=(",", ":")
                          )
                      )

                      for arg in field.get(
                          "args",
                          []
                      ):
                          print(
                              "      ARG:",
                              arg["name"],
                              "=>",
                              json.dumps(
                                  arg.get("type"),
                                  separators=(",", ":")
                              )
                          )


              inputs = t.get(
                  "inputFields"
              ) or []

              if inputs:
                  print("INPUT FIELDS:")

                  for field in inputs:
                      print(
                          "  *",
                          field["name"],
                          "=>",
                          json.dumps(
                              field.get("type"),
                              separators=(",", ":")
                          )
                      )


              enums = t.get(
                  "enumValues"
              ) or []

              if enums:
                  print(
                      "ENUM VALUES:",
                      ", ".join(
                          e["name"]
                          for e in enums
                      )
                  )


          print()
          print("=" * 80)
          print("TARGET ISINS")
          print("=" * 80)
          print("Romania Equity: LU0345402092")
          print("ING Dinamic:    LU1505916434")

          print()
          print("=" * 80)
          print("FINAL DIAGNOSTIC COMPLETE")
          print("=" * 80)

          PY

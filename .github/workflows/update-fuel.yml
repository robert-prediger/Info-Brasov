name: Update OMV fuel prices

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find OMV Gara and update fuel.json
        shell: python
        run: |
          import urllib.request
          import re
          import json
          from datetime import datetime

          base_url = "https://www.gazonline.ro/cautare.php"
          common = "jud_cod=BV&loc_id=2000&wsr=6b07df789c50cf06c7350ec1cdac0a0e"

          station_text = None

          for page in range(1, 5):

              if page == 1:
                  url = f"{base_url}?{common}"
              else:
                  url = f"{base_url}?{common}&pag={page}"

              print(f"Checking page {page}: {url}")

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept-Language": "ro-RO,ro;q=0.9"
                  }
              )

              html = urllib.request.urlopen(
                  req,
                  timeout=30
              ).read()

              text = html.decode(
                  "iso-8859-2",
                  errors="ignore"
              )

              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(r"<[^>]+>", " ", text)
              text = text.replace("&nbsp;", " ")
              text = re.sub(r"\s+", " ", text)

              # Cautam statia OMV de la Gara.
              # Folosim telefonul ca identificator unic,
              # pentru a evita probleme cu diacriticele.
              marker = "0372.868918"

              pos = text.find(marker)

              if pos != -1:
                  print(f"OMV Gara found on page {page}")
                  station_text = text[
                      max(0, pos - 700):
                      pos + 1200
                  ]
                  break

          if station_text is None:
              raise RuntimeError(
                  "OMV Gara nu a fost gasit pe paginile 1-4."
              )

          # Gasim data/ora si cele 4 preturi OMV.
          m = re.search(
              r"(\d{2}/\d{2}/\d{2})\s+"
              r"(\d{2}:\d{2})\s+"
              r"(\d+\.\d+)\s+-\s+"
              r"(\d+\.\d+)\s+"
              r"(\d+\.\d+)\s+"
              r"(\d+\.\d+)",
              station_text
          )

          if not m:
              print(station_text)
              raise RuntimeError(
                  "Preturile OMV Gara nu au putut fi extrase."
              )

          date, hour, maxx100, maxx95, maxxdiesel, diesel = m.groups()

          prices = [
              float(maxx100),
              float(maxx95),
              float(maxxdiesel),
              float(diesel)
          ]

          # Protectie impotriva unor valori gresite.
          if not all(5 < p < 20 for p in prices):
              raise RuntimeError(
                  f"Preturi suspecte: {prices}"
              )

          updated = datetime.strptime(
              date + " " + hour,
              "%d/%m/%y %H:%M"
          ).strftime("%d.%m.%Y %H:%M")

          data = {
              "source": "GazOnline",
              "station": "OMV Brasov - Gara, Bd. Garii 7A",
              "updated": updated,
              "prices": {
                  "super95": float(maxx95),
                  "maxx100": float(maxx100),
                  "diesel": float(diesel),
                  "maxxdiesel": float(maxxdiesel)
              }
          }

          with open(
              "fuel.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("fuel.json updated successfully:")
          print(json.dumps(data, indent=2))

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fuel.json

          if git diff --cached --quiet; then
            echo "No fuel price changes."
          else
            git commit -m "Update OMV Gara fuel prices"
            git push
          fi

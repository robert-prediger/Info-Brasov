name: Update ING Funds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-funds.yml
  schedule:
    # UTC envelope for 09:00–17:00 Europe/Bucharest in summer and winter.
    # The window step below skips the extra hour outside local working hours.
    - cron: "0 6-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-ing-funds
  cancel-in-progress: false

jobs:
  update-funds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Romania update window
        id: window
        run: |
          python <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Bucharest"))
          active = os.environ["GITHUB_EVENT_NAME"] != "schedule" or (
              now.weekday() < 5 and 9 <= now.hour <= 17
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"active={str(active).lower()}\n")
          print(f"Romania time: {now.isoformat()} | update: {active}")
          PY
      - name: Checkout repository
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read both NAVs from the official Goldman API
        if: steps.window.outputs.active == 'true'
        run: |
          python <<'PY'
          """Read the public API used by Goldman Sachs Fund Finder; publish both ISINs atomically."""
          import json
          import math
          import time
          import urllib.request
          from datetime import date, datetime
          from pathlib import Path

          ENDPOINT = 'https://am.gs.com/services/funds'
          SOURCE = 'https://am.gs.com/ro-ro/individual/funds'
          TARGETS = {'LU0345402092': 'Romania Equity', 'LU1505916434': 'ING Dinamic RON'}
          QUERY = '''query getFunds($fundRequest: FundRequest) {
            fundData(fundRequest: $fundRequest) {
              funds {
                fundName
                shareClasses {
                  shareClassId
                  baseCurrency
                  dailyPerformance {
                    nav { asAtDate value }
                    navChange { asAtDate value }
                  }
                }
              }
            }
          }'''


          def fetch_page(offset):
              variables = {'fundRequest': {
                  'country': 'ro', 'language': 'ro', 'audience': 'individual',
                  'limit': 100, 'offset': offset, 'sortBy': 'FN', 'sortOrder': 'ASC',
                  'filterParam': {'searchText': ''},
              }}
              payload = json.dumps({'query': QUERY, 'variables': variables}).encode()
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(ENDPOINT, data=payload, headers={
                          'Content-Type': 'application/json', 'Accept': 'application/json',
                          'Referer': SOURCE, 'User-Agent': 'Info-Brasov/1.0',
                      })
                      with urllib.request.urlopen(request, timeout=45) as response:
                          result = json.load(response)
                      if result.get('errors'):
                          raise ValueError('Goldman GraphQL errors: ' + json.dumps(result['errors']))
                      funds = result['data']['fundData']['funds']
                      if not isinstance(funds, list):
                          raise ValueError('Invalid Goldman fund list')
                      return funds
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)


          def read_official_funds():
              found = {}
              # Fund Finder paginates by fund, not by share class.
              for offset in range(0, 1000, 100):
                  funds = fetch_page(offset)
                  for fund in funds:
                      for share in fund.get('shareClasses') or []:
                          isin = share.get('shareClassId')
                          if isin in TARGETS:
                              if isin in found:
                                  raise ValueError('Duplicate ISIN: ' + isin)
                              found[isin] = share
                  if len(found) == len(TARGETS) or len(funds) < 100:
                      break
              missing = set(TARGETS) - set(found)
              if missing:
                  raise ValueError('Goldman did not return required ISINs: ' + ', '.join(sorted(missing)))
              return found


          def build_data(old_data, official):
              old_by_isin = {f['isin']: f for f in old_data['funds']}
              output = []
              dates = []
              for isin, name in TARGETS.items():
                  share = official[isin]
                  if share['baseCurrency'] != 'RON':
                      raise ValueError('Unexpected currency for ' + isin)
                  perf = share['dailyPerformance']
                  nav_data, change_data = perf['nav'], perf['navChange']
                  nav = float(nav_data['value'])
                  delta = float(change_data['value'])
                  nav_date = date.fromisoformat(nav_data['asAtDate'])
                  if change_data['asAtDate'] != nav_data['asAtDate']:
                      raise ValueError('NAV/change date mismatch for ' + isin)
                  if not all(math.isfinite(v) for v in (nav, delta)) or nav <= 0 or nav - delta <= 0:
                      raise ValueError('Invalid NAV for ' + isin)
                  if nav_date > date.today():
                      raise ValueError('Future NAV date for ' + isin)
                  old = old_by_isin[isin]
                  old_date = datetime.strptime(old.get('updated') or old_data['updated'], '%d.%m.%Y').date()
                  if nav_date < old_date:
                      raise ValueError('Refusing older NAV for ' + isin)
                  if abs(nav / float(old['nav']) - 1) > 0.20:
                      raise ValueError('NAV movement exceeds 20% for ' + isin)
                  # Goldman navChange is an amount in RON, not a percentage.
                  change = round(delta / (nav - delta) * 100, 2)
                  output.append({**old, 'name': name, 'currency': 'RON', 'nav': round(nav, 2),
                                 'change': change, 'updated': nav_date.strftime('%d.%m.%Y')})
                  dates.append(nav_date)
              return {**old_data, 'updated': min(dates).strftime('%d.%m.%Y'),
                      'source': 'Goldman Sachs', 'source_url': SOURCE, 'funds': output}


          def main(path=Path('funds.json')):
              old_data = json.loads(path.read_text(encoding='utf-8'))
              data = build_data(old_data, read_official_funds())
              text = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
              if path.read_text(encoding='utf-8') != text:
                  temporary = path.with_suffix('.json.tmp')
                  temporary.write_text(text, encoding='utf-8')
                  temporary.replace(path)
              for fund in data['funds']:
                  print(f"{fund['isin']}: {fund['nav']:.2f} RON | {fund['updated']} | {fund['change']:+.2f}%")


          if __name__ == '__main__':
              main()
          PY
      - name: Commit updated fund data
        if: steps.window.outputs.active == 'true'
        run: |
          if git diff --quiet funds.json; then
            echo "Both funds verified. No new data to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funds.json
          git commit -m "Update ING fund NAVs from Goldman Sachs"
          git pull --rebase origin main
          git push origin HEAD:main

name: Update OMV fuel prices

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update OMV Gara prices
        shell: python
        run: |
          import urllib.request
          import re
          import json
          from datetime import datetime

          base_url = "https://www.gazonline.ro/cautare.php"
          common = "jud_cod=BV&loc_id=2000&wsr=6b07df789c50cf06c7350ec1cdac0a0e"

          phone = "0372.868918"
          station_html = None

          for page in range(1, 5):

              if page == 1:
                  url = f"{base_url}?{common}"
              else:
                  url = f"{base_url}?{common}&pag={page}"

              print(f"Checking page {page}: {url}")

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept-Language": "ro-RO,ro;q=0.9"
                  }
              )

              raw = urllib.request.urlopen(
                  req,
                  timeout=30
              ).read()

              html = raw.decode(
                  "iso-8859-2",
                  errors="ignore"
              )

              pos = html.find(phone)

              if pos == -1:
                  continue

              print(f"OMV Gara found on page {page}")

              # Izolam doar statia OMV Gara.
              # Urmatoarea aparitie "OMV - Brasov"
              # marcheaza urmatoarea statie.
              start = html.rfind(
                  "OMV - Brasov",
                  0,
                  pos
              )

              if start == -1:
                  start = max(0, pos - 2000)

              end = html.find(
                  "OMV - Brasov",
                  pos + len(phone)
              )

              if end == -1:
                  end = min(
                      len(html),
                      pos + 10000
                  )

              station_html = html[start:end]
              break

          if station_html is None:
              raise RuntimeError(
                  "OMV Gara nu a fost gasit."
              )

          # GazOnline:
          #
          # B+  = MaxxMotion 100 Plus
          # B   = benzina standard / -
          # B95 = MaxxMotion 95
          # M+  = MaxxMotion Diesel
          # M   = OMV Diesel
          # GPL = -
          #
          # Extragem toate celulele din randul statiei.

          cells = re.findall(
              r"<td[^>]*>(.*?)</td>",
              station_html,
              flags=re.I | re.S
          )

          clean_cells = []

          for cell in cells:

              cell = re.sub(
                  r"<[^>]+>",
                  " ",
                  cell
              )

              cell = cell.replace(
                  "&nbsp;",
                  " "
              )

              cell = re.sub(
                  r"\s+",
                  " ",
                  cell
              ).strip()

              clean_cells.append(cell)

          print("CELLS FOUND:")
          for i, cell in enumerate(clean_cells):
              print(i, repr(cell))

          # Cautam celulele care contin preturi
          # sau "-" in ordinea coloanelor GazOnline.

          fuel_cells = []

          for cell in clean_cells:

              if re.fullmatch(
                  r"\d{1,2}\.\d{2}",
                  cell
              ):
                  fuel_cells.append(cell)

              elif cell == "-":
                  fuel_cells.append(cell)

          print("FUEL CELLS:", fuel_cells)

          # Trebuie sa avem cele 6 coloane:
          # B+, B, B95, M+, M, GPL

          sequence = None

          for i in range(
              max(0, len(fuel_cells) - 5)
          ):

              candidate = fuel_cells[i:i + 6]

              if len(candidate) != 6:
                  continue

              # Pentru OMV Gara ne asteptam ca
              # B si GPL sa fie "-"
              if (
                  candidate[1] == "-"
                  and candidate[5] == "-"
              ):
                  sequence = candidate
                  break

          if sequence is None:
              print(station_html)
              raise RuntimeError(
                  "Nu am putut identifica cele 6 coloane "
                  "de carburant pentru OMV Gara."
              )

          print("COLUMN SEQUENCE:", sequence)

          b_plus = sequence[0]
          b = sequence[1]
          b95 = sequence[2]
          m_plus = sequence[3]
          m = sequence[4]
          gpl = sequence[5]

          maxx100 = float(b_plus)
          super95 = float(b95)
          maxxdiesel = float(m_plus)
          diesel = float(m)

          prices = [
              maxx100,
              super95,
              maxxdiesel,
              diesel
          ]

          if not all(
              5 < price < 20
              for price in prices
          ):
              raise RuntimeError(
                  f"Preturi suspecte: {prices}"
              )

          # Cautam cea mai recenta data/ora
          # afisata in blocul statiei.

          dates = re.findall(
              r"(\d{2}/\d{2}/(?:\d{2}|\d{4}))"
              r"\s+"
              r"(\d{2}:\d{2})",
              station_html
          )

          if dates:
              parsed_dates = []

              for date, hour in dates:

                  year = date.split("/")[-1]

                  fmt = (
                      "%d/%m/%Y %H:%M"
                      if len(year) == 4
                      else "%d/%m/%y %H:%M"
                  )

                  try:
                      dt = datetime.strptime(
                          f"{date} {hour}",
                          fmt
                      )
                      parsed_dates.append(dt)
                  except ValueError:
                      pass

              if parsed_dates:
                  newest = max(parsed_dates)

                  updated = newest.strftime(
                      "%d.%m.%Y %H:%M"
                  )
              else:
                  updated = "necunoscut"
          else:
              updated = "necunoscut"

          data = {
              "source": "GazOnline",
              "station": "OMV Brasov - Gara, Bd. Garii 7A",
              "updated": updated,
              "prices": {
                  "super95": super95,
                  "maxx100": maxx100,
                  "diesel": diesel,
                  "maxxdiesel": maxxdiesel
              }
          }

          with open(
              "fuel.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("SUCCESS")
          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fuel.json

          if git diff --cached --quiet; then
            echo "No fuel price changes."
          else
            git commit -m "Update OMV Gara fuel prices"
            git push
          fi

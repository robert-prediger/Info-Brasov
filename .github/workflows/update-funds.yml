name: Test Goldman Romania Equity

on:
  workflow_dispatch:

jobs:
  test-goldman:
    runs-on: ubuntu-latest

    steps:
      - name: Test Goldman Sachs
        run: |
          python <<'PY'
          import urllib.request
          import re

          url = "https://am.gs.com/public-assets/documents/34015a76-44b1-11f1-9232-8fbc893bd354?view=true"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "*/*"
              }
          )

          try:
              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  data = response.read()

                  print("HTTP STATUS:", response.status)
                  print("CONTENT TYPE:",
                        response.headers.get("Content-Type"))
                  print("SIZE:", len(data), "bytes")

                  text = data.decode(
                      "utf-8",
                      errors="ignore"
                  )

                  print(
                      "ISIN FOUND:",
                      "LU0345402092" in text
                  )

                  values = [
                      "5026.67",
                      "5,026.67",
                      "5026,67",
                      "5.026,67"
                  ]

                  found = [
                      x for x in values
                      if x in text
                  ]

                  print(
                      "NAV 5026.67 FOUND:",
                      found if found else "NO"
                  )

                  print()
                  print("TEST FINISHED")

          except Exception as e:
              print("ERROR:", repr(e))
              raise

          PY

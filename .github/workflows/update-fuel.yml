name: Update OMV fuel prices

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find OMV Gara and update fuel.json
        shell: python
        run: |
          import urllib.request
          import re
          import json
          import html as html_lib

          base_url = "https://www.gazonline.ro/cautare.php"
          common = "jud_cod=BV&loc_id=2000&wsr=6b07df789c50cf06c7350ec1cdac0a0e"

          found = None

          for page in range(1, 5):
              if page == 1:
                  url = f"{base_url}?{common}"
              else:
                  url = f"{base_url}?{common}&pag={page}"

              print(f"Checking page {page}")

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              raw = urllib.request.urlopen(
                  req,
                  timeout=30
              ).read()

              page_html = raw.decode(
                  "iso-8859-2",
                  errors="ignore"
              )

              # Convertim HTML-ul in text simplu
              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  page_html,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(r"<[^>]+>", " ", text)
              text = html_lib.unescape(text)
              text = re.sub(r"\s+", " ", text)

              # Identificator unic pentru OMV Gara
              marker = "0372.868918"

              pos = text.find(marker)

              if pos != -1:
                  print(f"OMV Gara found on page {page}")

                  # Luam suficient text dupa telefon pentru
                  # a include cele patru preturi.
                  found = text[pos:pos + 2500]
                  break

          if found is None:
              raise RuntimeError(
                  "OMV Gara nu a fost gasit."
              )

          # Preturile apar in text sub forma:
          # >10.62 - Pret actualizat...
          price_matches = re.findall(
              r">\s*(\d{1,2}\.\d{2})\s*-\s*Pret actualizat",
              found
          )

          print("Prices found:", price_matches)

          if len(price_matches) < 4:
              print(found)
              raise RuntimeError(
                  "Nu au fost gasite cele 4 preturi OMV Gara."
              )

          maxx100 = float(price_matches[0])
          super95 = float(price_matches[1])
          maxxdiesel = float(price_matches[2])
          diesel = float(price_matches[3])

          prices = [
              maxx100,
              super95,
              maxxdiesel,
              diesel
          ]

          if not all(5 < p < 20 for p in prices):
              raise RuntimeError(
                  f"Preturi suspecte: {prices}"
              )

          # Extragem si data/ora primei actualizari.
          date_match = re.search(
              r"actualizat\s+\w+\s+"
              r"(\d{2}/\d{2}/\d{4})\s+"
              r"(\d{2}:\d{2})",
              found
          )

          if date_match:
              updated = (
                  date_match.group(1) +
                  " " +
                  date_match.group(2)
              )
          else:
              updated = "necunoscut"

          data = {
              "source": "GazOnline",
              "station": "OMV Brasov - Gara, Bd. Garii 7A",
              "updated": updated,
              "prices": {
                  "super95": super95,
                  "maxx100": maxx100,
                  "diesel": diesel,
                  "maxxdiesel": maxxdiesel
              }
          }

          with open(
              "fuel.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("SUCCESS")
          print(json.dumps(data, indent=2))

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fuel.json

          if git diff --cached --quiet; then
            echo "No fuel price changes."
          else
            git commit -m "Update OMV Gara fuel prices"
            git push
          fi

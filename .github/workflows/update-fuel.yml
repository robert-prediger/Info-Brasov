name: Update OMV fuel prices

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update OMV Gara prices
        shell: python
        run: |
          import urllib.request
          import re
          import json
          from datetime import datetime

          base_url = "https://www.gazonline.ro/cautare.php"
          common = "jud_cod=BV&loc_id=2000&wsr=6b07df789c50cf06c7350ec1cdac0a0e"

          marker = "0372.868918"
          station_text = None

          for page in range(1, 5):

              if page == 1:
                  url = f"{base_url}?{common}"
              else:
                  url = f"{base_url}?{common}&pag={page}"

              print(f"Checking page {page}: {url}")

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept-Language": "ro-RO,ro;q=0.9"
                  }
              )

              raw = urllib.request.urlopen(
                  req,
                  timeout=30
              ).read()

              text = raw.decode(
                  "iso-8859-2",
                  errors="ignore"
              )

              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(r"<[^>]+>", " ", text)
              text = text.replace("&nbsp;", " ")
              text = re.sub(r"\s+", " ", text)

              pos = text.find(marker)

              if pos != -1:

                  print(
                      f"OMV Gara found on page {page}"
                  )

                  start = text.rfind(
                      "OMV - Brasov",
                      0,
                      pos
                  )

                  if start == -1:
                      start = max(0, pos - 500)

                  end = text.find(
                      "OMV - Brasov",
                      pos + len(marker)
                  )

                  if end == -1:
                      end = min(
                          len(text),
                          pos + 2500
                      )

                  station_text = text[start:end]

                  break

          if station_text is None:
              raise RuntimeError(
                  "OMV Gara nu a fost gasit."
              )

          print("STATION:")
          print(station_text)

          # Preturile GazOnline apar dupa UnTip()">
          # Ordinea pentru OMV Gara este:
          # 1 MaxxMotion 100 Plus
          # 2 MaxxMotion 95
          # 3 MaxxMotion Diesel
          # 4 OMV Diesel

          matches = re.findall(
              r'UnTip\(\)">\s*(\d+\.\d+)',
              station_text
          )

          prices = []

          for value in matches:

              number = float(value)

              if 5 < number < 20:
                  prices.append(number)

          print("PRICES FOUND:", prices)

          if len(prices) < 4:
              raise RuntimeError(
                  f"Au fost gasite doar aceste "
                  f"preturi: {prices}"
              )

          maxx100 = prices[0]
          super95 = prices[1]
          maxxdiesel = prices[2]
          diesel = prices[3]

          # Protectie suplimentara:
          # benzina premium trebuie sa fie
          # >= benzina 95, iar diesel premium
          # >= diesel standard.

          if maxx100 < super95:
              raise RuntimeError(
                  "Ordinea preturilor benzinei "
                  "pare incorecta."
              )

          if maxxdiesel < diesel:
              raise RuntimeError(
                  "Ordinea preturilor diesel "
                  "pare incorecta."
              )

          # Extragem cea mai recenta data/ora
          # din blocul statiei.

          date_matches = re.findall(
              r"(\d{2}/\d{2}/(?:\d{2}|\d{4}))"
              r"\s+(\d{2}:\d{2})",
              station_text
          )

          parsed_dates = []

          for date, hour in date_matches:

              year = date.split("/")[-1]

              fmt = (
                  "%d/%m/%Y %H:%M"
                  if len(year) == 4
                  else "%d/%m/%y %H:%M"
              )

              try:
                  parsed_dates.append(
                      datetime.strptime(
                          f"{date} {hour}",
                          fmt
                      )
                  )
              except ValueError:
                  pass

          if parsed_dates:

              updated = max(
                  parsed_dates
              ).strftime(
                  "%d.%m.%Y %H:%M"
              )

          else:
              updated = "necunoscut"

          data = {
              "source": "GazOnline",
              "station": "OMV Brasov - Gara, Bd. Garii 7A",
              "updated": updated,
              "prices": {
                  "super95": super95,
                  "maxx100": maxx100,
                  "diesel": diesel,
                  "maxxdiesel": maxxdiesel
              }
          }

          with open(
              "fuel.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("SUCCESS:")
          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fuel.json

          if git diff --cached --quiet; then
            echo "No fuel price changes."
          else
            git commit -m "Update OMV Gara fuel prices"
            git push
          fi

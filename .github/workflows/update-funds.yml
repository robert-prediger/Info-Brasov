name: Test ING Fund Sources

on:
  workflow_dispatch:

jobs:
  test-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Test public fund sources
        run: |
          python <<'PY'
          import requests
          import re

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,*/*;q=0.8"
              ),
              "Accept-Language": "en-US,en;q=0.9",
          }

          sources = [
              {
                  "name": "YCharts Romania Equity",
                  "isin": "LU0345402092",
                  "url": (
                      "https://ycharts.com/mutual_funds/"
                      "M:LU0345402092/performance/price"
                  ),
              },
              {
                  "name": "YCharts ING Dinamic",
                  "isin": "LU1505916434",
                  "url": (
                      "https://ycharts.com/mutual_funds/"
                      "M:LU1505916434/performance/price"
                  ),
              },
              {
                  "name": "Investing ING Dinamic",
                  "isin": "LU1505916434",
                  "url": (
                      "https://www.investing.com/funds/"
                      "nn-ing-dinamic-x-cap-ron-historical-data"
                  ),
              },
              {
                  "name": "Goldman Sachs Dinamic factsheet",
                  "isin": "LU1505916434",
                  "url": (
                      "https://api.nnip.com/DocumentsApi/files/"
                      "FACTSHEET_LU1505916434_RO_EN"
                      "?channel=nnipcom"
                  ),
              },
              {
                  "name": "Goldman Sachs Romania Equity factsheet",
                  "isin": "LU0345402092",
                  "url": (
                      "https://api.nnip.com/DocumentsApi/files/"
                      "FACTSHEET_LU0345402092_RO_EN"
                      "?channel=nnipcom"
                  ),
              },
          ]

          print("=" * 70)
          print("ING FUND SOURCE DIAGNOSTIC")
          print("=" * 70)

          for source in sources:

              print()
              print("=" * 70)
              print(source["name"])
              print("ISIN:", source["isin"])
              print("=" * 70)

              try:
                  r = requests.get(
                      source["url"],
                      headers=HEADERS,
                      timeout=30,
                      allow_redirects=True,
                  )

                  print("HTTP STATUS:", r.status_code)
                  print("FINAL URL:", r.url)
                  print("CONTENT TYPE:",
                        r.headers.get("content-type"))
                  print("SIZE:", len(r.content), "bytes")

                  text = r.text

                  print(
                      "ISIN FOUND:",
                      source["isin"].lower()
                      in text.lower()
                  )

                  # Search for our known NAV values.
                  known_values = [
                      "5026.67",
                      "5,026.67",
                      "5026,67",
                      "5.026,67",
                      "2106.40",
                      "2,106.40",
                      "2106,40",
                      "2.106,40",
                  ]

                  found = []

                  for value in known_values:
                      if value in text:
                          found.append(value)

                  print(
                      "KNOWN NAV VALUES FOUND:",
                      found if found else "NONE"
                  )

                  # Look for numbers around the expected NAV ranges.
                  numbers = re.findall(
                      r'(?<!\d)'
                      r'(?:[1-9]\d{3}'
                      r'(?:[.,]\d{2,3})?)'
                      r'(?!\d)',
                      text
                  )

                  interesting = []

                  for number in numbers:
                      normalized = number.replace(",", ".")

                      try:
                          value = float(normalized)

                          if (
                              4800 <= value <= 5200
                              or
                              1950 <= value <= 2200
                          ):
                              if number not in interesting:
                                  interesting.append(number)

                      except ValueError:
                          pass

                  print(
                      "POSSIBLE NAV NUMBERS:",
                      interesting[:20]
                      if interesting else "NONE"
                  )

                  # Show a small text fragment around ISIN.
                  pos = text.lower().find(
                      source["isin"].lower()
                  )

                  if pos >= 0:
                      start = max(0, pos - 250)
                      end = min(
                          len(text),
                          pos + 500
                      )

                      snippet = text[start:end]

                      snippet = re.sub(
                          r"\s+",
                          " ",
                          snippet
                      )

                      print(
                          "ISIN CONTEXT:",
                          snippet[:750]
                      )

                  else:
                      print(
                          "ISIN CONTEXT: not available"
                      )

              except Exception as e:
                  print(
                      "REQUEST ERROR:",
                      type(e).__name__,
                      str(e)
                  )

          print()
          print("=" * 70)
          print("DIAGNOSTIC FINISHED")
          print("=" * 70)

          PY

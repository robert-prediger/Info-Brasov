name: Find Goldman GraphQL Endpoint

on:
  workflow_dispatch:

jobs:
  find-endpoint:
    runs-on: ubuntu-latest

    steps:
      - name: Find GraphQL endpoint
        run: |
          python <<'PY'
          import re
          import urllib.request
          import urllib.parse
          import html

          PAGE = (
              "https://am.gs.com/ro-ro/individual/funds"
              "?locale=ro-ro"
              "&audience=individual"
              "&sf=currencies"
              "&filters=currencies%7CRON"
          )

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "ro-RO,ro;q=0.9,en;q=0.8"
          }

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as r:

                  return (
                      r.status,
                      r.read().decode(
                          "utf-8",
                          errors="ignore"
                      )
                  )

          print("=" * 70)
          print("SEARCHING FOR GOLDMAN GRAPHQL ENDPOINT")
          print("=" * 70)

          status, page = get(PAGE)

          print("PAGE HTTP:", status)

          scripts = re.findall(
              r'<script[^>]+src=["\']([^"\']+)["\']',
              page,
              flags=re.I
          )

          scripts = list(
              dict.fromkeys(
                  html.unescape(x)
                  for x in scripts
              )
          )

          print(
              "JS FILES:",
              len(scripts)
          )


          search_terms = [
              "FUND_SERVICE_GRAPHQL_ENDPOINT",
              "fund_service_graphql_endpoint",
              "/graphql",
              "graphql"
          ]


          for number, script in enumerate(
              scripts,
              start=1
          ):

              url = urllib.parse.urljoin(
                  PAGE,
                  script
              )

              try:
                  js_status, js = get(url)

              except Exception:
                  continue


              lower = js.lower()

              if "graphql" not in lower:
                  continue


              print()
              print("=" * 70)
              print(
                  "GRAPHQL JS FILE:",
                  number
              )
              print(
                  "URL:",
                  url
              )
              print(
                  "HTTP:",
                  js_status
              )
              print(
                  "SIZE:",
                  len(js)
              )


              for term in search_terms:

                  start_search = 0

                  while True:

                      pos = lower.find(
                          term.lower(),
                          start_search
                      )

                      if pos < 0:
                          break

                      start = max(
                          0,
                          pos - 800
                      )

                      end = min(
                          len(js),
                          pos + 1200
                      )

                      context = js[start:end]

                      context = (
                          context
                          .replace("\\u002F", "/")
                          .replace("\\/", "/")
                      )

                      print()
                      print(
                          "----- MATCH:",
                          term,
                          "-----"
                      )

                      print(
                          context
                      )

                      start_search = (
                          pos + len(term)
                      )


              # --------------------------------------------
              # Find complete URLs containing graphql
              # --------------------------------------------

              urls = re.findall(
                  r'https?://[^"\'\s\\<>]+',
                  js
              )

              graphql_urls = []

              for candidate in urls:

                  candidate = (
                      candidate
                      .replace("\\u002F", "/")
                      .replace("\\/", "/")
                  )

                  if (
                      "graphql"
                      in candidate.lower()
                  ):
                      if (
                          candidate
                          not in graphql_urls
                      ):
                          graphql_urls.append(
                              candidate
                          )


              if graphql_urls:

                  print()
                  print(
                      "GRAPHQL URLS FOUND:"
                  )

                  for candidate in graphql_urls:
                      print(
                          ">>>",
                          candidate
                      )


          # ------------------------------------------------
          # Search page itself for configuration values
          # ------------------------------------------------

          print()
          print("=" * 70)
          print("PAGE CONFIG SEARCH")
          print("=" * 70)

          page_lower = page.lower()

          for term in search_terms:

              pos = page_lower.find(
                  term.lower()
              )

              if pos >= 0:

                  start = max(
                      0,
                      pos - 1000
                  )

                  end = min(
                      len(page),
                      pos + 1500
                  )

                  print()
                  print(
                      "PAGE MATCH:",
                      term
                  )

                  print(
                      page[start:end]
                  )


          print()
          print("=" * 70)
          print("ENDPOINT SEARCH FINISHED")
          print("=" * 70)

          PY
